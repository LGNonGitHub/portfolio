<!doctype html>
<html><head><meta charset="utf-8"><title>Mana Stage prototype</title>
<style>html,body{margin:0;height:100%;background:#08060e;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas>
<script>
// ---------------------------------------------------------------------------
// Prototype: one particle body, seven formations, morph + bloom + CA + grain.
// Raw WebGL2, no library. Formations are baked into an RGBA32F texture
// (xyz = position, w = brightness) and fetched by gl_VertexID.
// ---------------------------------------------------------------------------
const N = 24576, W = 256, ROWS = N / W, F = 7;
const rnd = (() => { let s = 7; return () => ((s = Math.imul(s ^ (s >>> 15), 0x2c1b3c6d) + 0x9e3779b9 | 0) >>> 0) / 4294967296; })();

// --- shape samplers: each returns [x,y,z,w] in roughly [-1,1] ---------------
const S = 1 / 190, CX = 210, CY = 250;                    // SectionArt SVG space -> unit
const sv = (x, y, z = 0, w = 1) => [(x - CX) * S, -(y - CY) * S, z, w];
const lerp = (a, b, t) => a + (b - a) * t;
function onSeg(ax, ay, bx, by, w = 1) { const t = rnd(); return sv(lerp(ax, bx, t), lerp(ay, by, t), (rnd() - .5) * .03, w); }
function onPoly(pts, w = 1, closed = false) {
  const segs = []; let L = 0;
  for (let i = 0; i < pts.length - (closed ? 0 : 1); i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]); segs.push([a, b, l]); L += l; }
  let r = rnd() * L; for (const [a, b, l] of segs) { if (r <= l) return onSeg(a[0], a[1], b[0], b[1], w); r -= l; }
  const [a, b] = segs[segs.length - 1]; return onSeg(a[0], a[1], b[0], b[1], w);
}
function ring(cx, cy, r, w = 1, jitter = 0) { const a = rnd() * 6.2832; const rr = r + (rnd() - .5) * jitter; return sv(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, (rnd() - .5) * .02, w); }
function cubic(p0, p1, p2, p3, w = 1) { const t = rnd(), u = 1 - t; const x = u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0]; const y = u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]; return sv(x, y, 0, w); }
function inPoly(pts, w = 1) { // rejection sample inside polygon
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9; for (const [x, y] of pts) { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); }
  for (let k = 0; k < 200; k++) { const x = lerp(minx, maxx, rnd()), y = lerp(miny, maxy, rnd()); let c = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; }
    if (c) return sv(x, y, (rnd() - .5) * .05, w); }
  return sv(pts[0][0], pts[0][1]);
}
const pick = (table) => { let r = rnd() * table.reduce((s, t) => s + t[0], 0); for (const [p, f] of table) { if (r < p) return f(); r -= p; } return table[0][1](); };
const starPoly = (n, skip, r, cx = CX, cy = CY, rot = -Math.PI / 2) => { const o = []; for (let i = 0, v = 0; i <= n; i++, v = (v + skip) % n) { const a = v / n * 6.2832 + rot; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return o; };

// --- the seven formations (all original geometry, after SectionArt.tsx) ----
const formations = [
  // 0 HERO — ManaCore's sigil: dotted disc, rings, heptagram {7/3}, runes, motes (lies flat; tilted by camera)
  () => pick([
    [5, () => { const r = 55 + Math.floor(rnd() * 22) / 21 * 245; return ring(CX, CY, r * .62, .8); }],
    [1.2, () => ring(CX, CY, 305 * .62, 1.3)], [1.0, () => ring(CX, CY, 245 * .62, 1.3)], [.8, () => ring(CX, CY, 150 * .62, 1.4)],
    [1.6, () => onPoly(starPoly(7, 3, 220 * .62), 1.1)],
    [1, () => { const i = Math.floor(rnd() * 56), a = i / 56 * 6.2832, l = i % 4 ? .45 : 1; const r = lerp(260, 260 + 35 * l, rnd()) * .62; return sv(CX + Math.cos(a) * r, CY + Math.sin(a) * r, 0, 1); }],
    [1.4, () => { const a = rnd() * 6.2832, r = (140 + rnd() * 190) * .62; const p = sv(CX + Math.cos(a) * r, CY + Math.sin(a) * r); p[2] = (rnd() - .5) * .6; p[3] = .5; return p; }],
  ]),
  // 1 WORK · Black Clover — a grimoire thrown open under a pentagram
  () => pick([
    [1.2, () => ring(CX, CY, 168, .7)], [1.4, () => { const p = ring(CX, CY, 146, .9, 6); return p; }],
    [2.2, () => onPoly(starPoly(5, 2, 146), 1.1)],
    [1.5, () => rnd() < .5 ? cubic([210,212],[176,186],[132,174],[88,174],1.4) : cubic([210,212],[244,186],[288,174],[332,174],1.4)],
    [1.2, () => rnd() < .5 ? cubic([88,364],[132,364],[176,376],[210,402],1.4) : cubic([332,364],[288,364],[244,376],[210,402],1.4)],
    [.8, () => rnd() < .5 ? onSeg(88,174,88,364,1.2) : onSeg(332,174,332,364,1.2)],
    [.7, () => onSeg(210, 212, 210, 424, 1.3)],
    [1.6, () => { const i = Math.floor(rnd() * 7), y = 214 + i * 22; return rnd() < .5 ? onSeg(106, y, 184, y, .8) : onSeg(236, y, 314, y, .8); }],
    [1.4, () => { const s = [[160,150],[268,138],[210,118],[128,186],[300,176]][Math.floor(rnd()*5)]; const a = rnd()*6.28, r = rnd()*9; const p = sv(s[0]+Math.cos(a)*r, s[1]+Math.sin(a)*r); p[2] = rnd()*.25; p[3] = 1.6; return p; }],
  ]),
  // 2 ABOUT · My Hero Academia — a bolt through halftone, burst frame, speed lines
  () => pick([
    [4, () => inPoly([[238,130],[150,268],[212,268],[194,390],[302,238],[236,238]], 1.5)],
    [3, () => { const g = 9, x = CX - 140 + Math.floor(rnd() * 31) * g, y = CY - 140 + Math.floor(rnd() * 31) * g; const d = Math.hypot(x - CX, y - CY); return d < 140 ? sv(x, y, 0, .35 + .5 * (1 - d / 140)) : ring(CX, CY, 140, .3); }],
    [1.6, () => onPoly(Array.from({length: 28}, (_, i) => { const a = i / 28 * 6.2832, r = i % 2 ? 150 : 182; return [CX + Math.cos(a) * r, CY + Math.sin(a) * r * 1.08]; }), .8, true)],
    [1.6, () => { const i = Math.floor(rnd() * 18), a = i / 18 * 6.2832; const w = i % 3 ? .6 : 1.2; return onSeg(CX + Math.cos(a) * 112, CY + Math.sin(a) * 112, CX + Math.cos(a) * 176, CY + Math.sin(a) * 176, w); }],
  ]),
  // 3 STACK · Wistoria — sword and wand crossed under a star chart
  () => pick([
    [2.2, () => onSeg(126, 412, 300, 196, 1.4)], [.5, () => onSeg(286, 170, 314, 196, 1.4)],
    [2.2, () => onSeg(296, 412, 132, 198, 1.4)],
    [1, () => onPoly(starPoly(5, 2, 16, 126, 190), 1.8)],
    [1.6, () => { const L = [[96,128,168,92],[168,92,250,118],[250,118,318,86],[318,86,346,168],[168,92,214,150],[214,150,286,206],[150,186,214,150],[112,318,150,186]][Math.floor(rnd()*8)]; return onSeg(...L, .5); }],
    [1.4, () => { const s = [[96,128],[168,92],[250,118],[318,86],[346,168],[78,212],[150,186],[286,206],[112,318],[330,300],[214,150],[60,150]][Math.floor(rnd()*12)]; const a = rnd()*6.28, r = Math.pow(rnd(), 2) * 7; return sv(s[0]+Math.cos(a)*r, s[1]+Math.sin(a)*r, 0, 1.8); }],
    [1.2, () => ring(CX, CY, 178, .55)], [.8, () => ring(CX, CY, 140, .4)],
  ]),
  // 4 PATH · Sword Art Online — a floating tower of floors (true 3D rings), spire, horizon grid
  () => pick([
    [6, () => { const i = Math.floor(rnd() * 7), r = (0.62 - i * 0.065), y = -0.62 + i * 0.2, a = rnd() * 6.2832; return [Math.cos(a) * r, y, Math.sin(a) * r * .55, 1 + i * .08]; }],
    [1.4, () => { const i = Math.floor(rnd() * 7), r = (0.62 - i * 0.065), y = -0.62 + i * 0.2 - 0.06, a = rnd() * 6.2832; return [Math.cos(a) * r * .9, y, Math.sin(a) * r * .5, .45]; }],
    [.6, () => [0, 0.78 + rnd() * .3, 0, 1.4]],
    [1.6, () => { const i = Math.floor(rnd() * 9); return [lerp(-1, 1, rnd()), -0.82 - i * .04, 0, .5 - i * .04]; }],
    [.8, () => { const c = Math.floor(rnd() * 4), sx = c % 2 ? 1 : -1, sy = c < 2 ? 1 : -1; return rnd() < .5 ? [sx * (.9 - rnd() * .2), sy * .95, 0, .9] : [sx * .9, sy * (.95 - rnd() * .2), 0, .9]; }],
  ]),
  // 5 HOBBY · photography — a six-blade aperture iris with a focus-scale rim
  () => pick([
    [4, () => { const i = Math.floor(rnd() * 6), a = i / 6 * 6.2832, a2 = a + 1.25; const r0 = 70, r1 = 175; return onSeg(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0, CX + Math.cos(a2) * r1, CY + Math.sin(a2) * r1, 1.1); }],
    [1.6, () => ring(CX, CY, 178, 1.1)], [1, () => ring(CX, CY, 192, .6)],
    [1.2, () => { const i = Math.floor(rnd() * 72), a = i / 72 * 6.2832, l = i % 6 ? 6 : 14; return onSeg(CX + Math.cos(a) * 196, CY + Math.sin(a) * 196, CX + Math.cos(a) * (196 + l), CY + Math.sin(a) * (196 + l), .8); }],
    [1.4, () => { const a = rnd() * 6.28, r = Math.sqrt(rnd()) * 66; return sv(CX + Math.cos(a) * r, CY + Math.sin(a) * r, 0, .25); }],
  ]),
  // 6 CONTACT · Fragrant Flower — five petals, stamens, petals drifting loose
  () => pick([
    [5, () => { const i = Math.floor(rnd() * 5), t = rnd() * 6.2832; const ex = Math.cos(t) * 36, ey = 186 - 250 + Math.sin(t) * 62; const a = i * 72 * Math.PI / 180; return sv(CX + ex * Math.cos(a) - ey * Math.sin(a), CY + ex * Math.sin(a) + ey * Math.cos(a), 0, 1.1); }],
    [1, () => { const a = rnd() * 6.28, r = Math.sqrt(rnd()) * 17; return sv(CX + Math.cos(a) * r, CY + Math.sin(a) * r, 0, 1.8); }],
    [.6, () => { const i = Math.floor(rnd() * 8), a = i / 8 * 6.2832; return sv(CX + Math.cos(a) * 26 + (rnd()-.5)*4, CY + Math.sin(a) * 26 + (rnd()-.5)*4, 0, 1.6); }],
    [2, () => { const P = [[78,136,-28],[334,160,34],[60,350,18],[352,372,-22],[128,432,8],[296,452,-14],[166,96,24]][Math.floor(rnd()*7)]; const t = rnd()*6.28, ex = Math.cos(t)*8, ey = Math.sin(t)*14, a = P[2]*Math.PI/180; const p = sv(P[0] + ex*Math.cos(a) - ey*Math.sin(a), P[1] + ex*Math.sin(a) + ey*Math.cos(a)); p[2] = (rnd()-.5)*.4; p[3] = .8; return p; }],
    [1, () => ring(CX, CY, 162, .45)],
  ]),
];
const data = new Float32Array(W * ROWS * F * 4);
formations.forEach((f, k) => { for (let i = 0; i < N; i++) data.set(f(), (k * N + i) * 4); });
const seeds = new Float32Array(N * 4); for (let i = 0; i < N * 4; i++) seeds[i] = rnd();

// --- GL plumbing ------------------------------------------------------------
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('EXT_color_buffer_half_float');
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, '#version 300 es\nprecision highp float;\n' + src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + src); return s; }
function prog(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name; u[nm] = gl.getUniformLocation(p, nm); } return { p, u }; }

const ftex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, ftex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, W, ROWS * F, 0, gl.RGBA, gl.FLOAT, data);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const sb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, sb); gl.bufferData(gl.ARRAY_BUFFER, seeds, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);

const NOISE = `
vec3 hash3(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx)*2.-1.;}
vec3 curlish(vec3 p){return vec3(sin(p.y*1.7+p.z),sin(p.z*1.3+p.x*1.1),sin(p.x*1.9+p.y*.7));}`;

const particles = prog(`
layout(location=0) in vec4 aSeed;
uniform sampler2D uF; uniform float uFrom, uTo, uMix, uTime, uAspect, uScale, uDpr, uVel;
uniform vec2 uOffset; uniform vec3 uC1, uC2; uniform float uTiltA, uTiltB, uSpinZA, uSpinZB, uSpinYA, uSpinYB;
out vec3 vCol; out float vA;
${NOISE}
vec4 fetchF(float k){int id=gl_VertexID; return texelFetch(uF, ivec2(id%${W}, int(k)*${ROWS}+id/${W}), 0);}
mat3 rx(float a){float c=cos(a),s=sin(a);return mat3(1,0,0,0,c,s,0,-s,c);}
mat3 ry(float a){float c=cos(a),s=sin(a);return mat3(c,0,-s,0,1,0,s,0,c);}
mat3 rz(float a){float c=cos(a),s=sin(a);return mat3(c,s,0,-s,c,0,0,0,1);}
void main(){
  vec4 A=fetchF(uFrom), B=fetchF(uTo);
  // staggered swarm: each mote leaves on its own beat, and arcs out through noise
  float t=clamp((uMix-aSeed.x*.4)/.6,0.,1.); t=t*t*(3.-2.*t);
  vec3 p=mix(A.xyz,B.xyz,t);
  p+=curlish(p*2.3+aSeed.yzw*6.+uTime*.15)*.35*sin(3.14159*t);
  p+=hash3(aSeed.xyz*91.+floor(uTime*.0))*.004;                 // breath
  p.y+=sin(uTime*(.4+aSeed.y)+aSeed.z*20.)*.008;
  float tilt=mix(uTiltA,uTiltB,t);
  float sz=mix(uSpinZA,uSpinZB,t)*uTime, sy=mix(uSpinYA,uSpinYB,t)*uTime;
  p=rx(tilt)*ry(sy)*rz(sz)*p;
  // camera: simple perspective
  vec3 cam=p+vec3(0,0,-3.2);
  float persp=1.6/(-cam.z);
  vec2 ndc=p.xy*persp*uScale; ndc.x/=uAspect; ndc+=uOffset;
  gl_Position=vec4(ndc,0,1);
  float w=mix(A.w,B.w,t);
  gl_PointSize=(1.4+aSeed.w*1.6)*w*uDpr*persp*1.25;
  vCol=mix(uC1,uC2,step(.72,aSeed.y));
  vA=(.35+.65*aSeed.z)*mix(1.,.55,sin(3.14159*t));
}`, `
in vec3 vCol; in float vA; out vec4 o;
void main(){ vec2 d=gl_PointCoord-.5; float r=length(d); float m=smoothstep(.5,.2,r); o=vec4(vCol*vA*m,1.); }`);

const quadVS = `out vec2 vUv; void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); vUv=p; gl_Position=vec4(p*2.-1.,0,1); }`;
// dual-filter (Kawase) down / up
const down = prog(quadVS, `in vec2 vUv; uniform sampler2D uT; uniform vec2 uPx; out vec4 o;
void main(){ vec4 s=texture(uT,vUv)*4.; s+=texture(uT,vUv-uPx); s+=texture(uT,vUv+uPx); s+=texture(uT,vUv+vec2(uPx.x,-uPx.y)); s+=texture(uT,vUv-vec2(uPx.x,-uPx.y)); o=s/8.; }`);
const up = prog(quadVS, `in vec2 vUv; uniform sampler2D uT; uniform vec2 uPx; out vec4 o;
void main(){ vec4 s=texture(uT,vUv+vec2(-uPx.x*2.,0.)); s+=texture(uT,vUv+vec2(-uPx.x,uPx.y))*2.; s+=texture(uT,vUv+vec2(0.,uPx.y*2.)); s+=texture(uT,vUv+vec2(uPx.x,uPx.y))*2.;
 s+=texture(uT,vUv+vec2(uPx.x*2.,0.)); s+=texture(uT,vUv+vec2(uPx.x,-uPx.y))*2.; s+=texture(uT,vUv+vec2(0.,-uPx.y*2.)); s+=texture(uT,vUv+vec2(-uPx.x,-uPx.y))*2.; o=s/12.; }`);
const comp = prog(quadVS, `in vec2 vUv; uniform sampler2D uScene, uBloom; uniform float uVel, uTime, uBloomK; uniform vec3 uBg, uC1, uC2; uniform vec2 uRes, uOffset; out vec4 o;
float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
vec3 samp(vec2 uv){ return texture(uScene,uv).rgb + texture(uBloom,uv).rgb*uBloomK; }
void main(){
  vec2 uv=vUv; vec2 c=uOffset*.5+.5; vec2 dir=uv-c;
  float v=clamp(abs(uVel),0.,1.);
  // velocity chromatic split, radial from the sigil's centre
  vec2 ca=dir*v*.018;
  vec3 col=vec3(samp(uv+ca).r, samp(uv).g, samp(uv-ca).b);
  // vertical speed streak (scroll direction), 6 taps
  if(v>.02){ vec3 acc=vec3(0); for(int i=1;i<=6;i++){ acc+=samp(uv+vec2(0.,float(i)*.006*v*sign(uVel))); } col=mix(col,acc/6.,v*.6); }
  // section wash, same recipe as .motif-field::before
  vec2 a=vUv*vec2(uRes.x/uRes.y,1.);
  vec3 bg=uBg + uC1*.22*smoothstep(.75,0.,length((vUv-vec2(.1,1.))*vec2(1.,1.6))) + uC2*.18*smoothstep(.7,0.,length((vUv-vec2(.9,0.))*vec2(1.,1.6)));
  col=bg+col;
  col+=(h(vUv*uRes+fract(uTime)*91.)-.5)*.035;                          // grain
  col*=1.-.25*pow(length(vUv-.5)*1.25,2.);                              // vignette
  o=vec4(col,1);
}`);

function rt(w, h) { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR)); [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t, f, w, h }; }
let scene, mips = [];
const dpr = Math.min(devicePixelRatio, 1.5);
function resize() { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; scene = rt(cv.width, cv.height); mips = []; let w = cv.width, h = cv.height; for (let i = 0; i < 5; i++) { w = Math.max(1, w >> 1); h = Math.max(1, h >> 1); mips.push(rt(w, h)); } }
resize();

const PAL = [ [[60,214,140],[162,118,255]], [[242,85,95],[232,185,74]], [[74,222,128],[250,204,21]], [[167,139,250],[86,200,255]], [[34,211,238],[129,140,248]], [[34,211,238],[129,140,248]], [[249,168,212],[196,181,253]] ];
const TILT = [-1.15, 0, 0, 0, 0.32, 0, 0];
const SPINZ = [0.05, 0, 0, 0, 0, 0.03, 0], SPINY = [0, 0, 0, 0, 0.12, 0, 0];
const c255 = c => c.map(v => v / 255);
const mixC = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));

window.renderAt = function (m, vel = 0, time = 10, offset = [0.42, 0.02], scale = 1.05) {
  const from = Math.floor(m), to = Math.min(F - 1, from + 1), t = m - from;
  const tt = Math.min(1, Math.max(0, t));
  const c1 = c255(mixC(PAL[from][0], PAL[to][0], tt)), c2 = c255(mixC(PAL[from][1], PAL[to][1], tt));
  // particles -> scene
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.f); gl.viewport(0, 0, scene.w, scene.h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(particles.p); const u = particles.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, ftex); gl.uniform1i(u.uF, 0);
  gl.uniform1f(u.uFrom, from); gl.uniform1f(u.uTo, to); gl.uniform1f(u.uMix, t); gl.uniform1f(u.uTime, time);
  gl.uniform1f(u.uAspect, cv.width / cv.height); gl.uniform1f(u.uScale, scale); gl.uniform1f(u.uDpr, dpr); gl.uniform1f(u.uVel, vel);
